<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repaso — Sistema de Gestión de la Seguridad Operacional (SMS)</title>
<style>
:root{
  --bg:#f5f3ff;
  --card:#ffffff;
  --violet:#7c3aed;
  --violet-d:#5b21b6;
  --pink:#ec4899;
  --cyan:#06b6d4;
  --orange:#f97316;
  --green:#16a34a;
  --red:#dc2626;
  --ink:#1e1b2e;
  --ink-soft:#4b4560;
  --border:#e6e0ff;
  --shadow: 0 10px 30px rgba(124,58,237,.12);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 10% -10%, #fce7f3 0%, transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, #cffafe 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  font-size:19px;
  line-height:1.55;
}
h1,h2,h3,h4{font-family:'Segoe UI', system-ui, sans-serif; margin:0 0 .4em 0; line-height:1.2;}
p{margin:.4em 0 1em 0;}

header.top{
  background:linear-gradient(120deg,var(--violet) 0%, var(--pink) 55%, var(--orange) 100%);
  color:#fff;
  padding:38px 20px 30px;
  text-align:center;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
header.top::after{
  content:"";
  position:absolute; inset:0;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 2px, transparent 2px 40px);
  pointer-events:none;
}
header.top .eyebrow{
  display:inline-block;
  background:rgba(255,255,255,.22);
  padding:6px 18px;
  border-radius:999px;
  font-weight:700;
  letter-spacing:.12em;
  font-size:15px;
  margin-bottom:14px;
  backdrop-filter:blur(4px);
}
header.top h1{
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  text-shadow:0 4px 18px rgba(0,0,0,.18);
  margin-bottom:8px;
}
header.top .sub{
  font-size:19px;
  font-weight:600;
  opacity:.95;
}
header.top .chips{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
header.top .chips span{
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.4);
  padding:6px 16px;
  border-radius:999px;
  font-size:15px;
  font-weight:700;
}

nav.tabs{
  position:sticky; top:0; z-index:50;
  background:#ffffffee;
  backdrop-filter:blur(8px);
  border-bottom:4px solid var(--violet);
  display:flex;
  overflow-x:auto;
  padding:8px 8px;
  gap:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}
nav.tabs button{
  flex:0 0 auto;
  border:none;
  background:#f1edff;
  color:var(--violet-d);
  font-weight:800;
  font-size:15px;
  padding:12px 15px;
  border-radius:14px;
  cursor:pointer;
  white-space:nowrap;
  transition:.15s;
}
nav.tabs button:hover{background:#e4d9ff;}
nav.tabs button.active{
  background:linear-gradient(120deg,var(--violet),var(--pink));
  color:#fff;
  box-shadow:0 6px 16px rgba(124,58,237,.4);
  transform:translateY(-1px);
}

main{max-width:980px; margin:0 auto; padding:30px 18px 90px;}
section.panel{display:none;}
section.panel.active{display:block; animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.moduletitle{
  display:flex; align-items:center; gap:14px;
  margin-bottom:22px;
}
.moduletitle .num{
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#fff; font-weight:900; font-size:20px;
  width:52px; height:52px; border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow); flex-shrink:0;
}
.moduletitle h2{font-size:26px; color:var(--violet-d); font-weight:900;}
.moduletitle .desc{font-size:16px; color:var(--ink-soft); margin-top:2px;}

.card{
  background:var(--card);
  border:2px solid var(--border);
  border-radius:20px;
  padding:22px 24px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}
.card h3{
  color:var(--pink);
  font-size:20px;
  font-weight:900;
  border-bottom:3px dashed var(--border);
  padding-bottom:8px;
  margin-bottom:12px;
}
.card h4{color:var(--violet-d); font-size:17px; font-weight:800; margin-top:14px;}
.card.alt{border-color:#bae6fd; background:#f0fbff;}
.card.warn{border-color:#fed7aa; background:#fff8f0;}
.card.ok{border-color:#bbf7d0; background:#f2fff6;}

.tag-row{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.tag{
  background:linear-gradient(120deg,var(--violet),var(--pink));
  color:#fff; font-weight:800; font-size:13.5px;
  padding:5px 13px; border-radius:999px;
}
.tag.cy{background:linear-gradient(120deg,var(--cyan),#3b82f6);}
.tag.or{background:linear-gradient(120deg,var(--orange),#ef4444);}
.tag.gr{background:linear-gradient(120deg,#22c55e,#0ea5e9);}

table{width:100%; border-collapse:collapse; margin:14px 0; font-size:16.5px;}
th{
  background:linear-gradient(120deg,var(--violet),var(--pink));
  color:#fff; text-align:left; padding:10px 12px; font-size:14.5px;
}
td{padding:9px 12px; border-bottom:1px solid var(--border);}
tr:nth-child(even) td{background:#faf8ff;}

ul,ol{padding-left:24px;}
li{margin-bottom:6px;}
strong{color:var(--violet-d);}
.hl{background:linear-gradient(120deg,#fde68a,#fbcfe8); padding:1px 6px; border-radius:6px; font-weight:800;}
code{background:#efe9ff; padding:2px 7px; border-radius:6px; font-family:'Consolas',monospace; color:var(--violet-d); font-weight:700;}
em{color:var(--ink-soft);}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:680px){.grid2{grid-template-columns:1fr;}}

/* TEST */
#test-intro{
  background:linear-gradient(120deg,var(--violet),var(--pink),var(--orange));
  color:#fff; border-radius:22px; padding:28px; text-align:center; box-shadow:var(--shadow);
}
#test-intro h2{font-size:28px;}
#test-intro p{font-size:17px; opacity:.95;}
#progressWrap{
  position:sticky; top:66px; z-index:40;
  background:#ffffffee; backdrop-filter:blur(6px);
  border:2px solid var(--border); border-radius:16px;
  padding:12px 18px; margin:18px 0; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
#progressBarOuter{flex:1; min-width:160px; background:#efe9ff; border-radius:999px; height:16px; overflow:hidden;}
#progressBarInner{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink)); transition:.3s;}
#progressText{font-weight:900; color:var(--violet-d); white-space:nowrap;}
#gradeBtn{
  border:none; cursor:pointer; font-weight:900; font-size:16px;
  padding:10px 20px; border-radius:12px; color:#fff;
  background:linear-gradient(120deg,var(--green),#0ea5e9);
  opacity:.5; pointer-events:none;
}
#gradeBtn.enabled{opacity:1; pointer-events:auto; box-shadow:0 6px 16px rgba(22,163,74,.4);}

.qcard{
  background:var(--card); border:2px solid var(--border); border-radius:18px;
  padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow);
  transition:.2s;
}
.qcard .qhead{display:flex; gap:10px; align-items:flex-start; margin-bottom:12px;}
.qcard .qnum{
  flex-shrink:0; width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px;
}
.qcard .qtext{font-weight:700; font-size:18px; color:var(--ink);}
.qcard .qtype{font-size:12.5px; font-weight:800; color:var(--pink); text-transform:uppercase; letter-spacing:.05em;}
.options{display:flex; flex-direction:column; gap:9px;}
.opt{
  display:flex; align-items:center; gap:10px;
  border:2px solid var(--border); border-radius:12px; padding:11px 14px;
  cursor:pointer; font-size:16.5px; background:#fbfaff; transition:.15s;
}
.opt:hover{border-color:var(--violet); background:#f3edff;}
.opt .bullet{
  width:24px; height:24px; border-radius:7px; border:2px solid var(--violet);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:var(--violet);
}
.qcard.locked .opt{cursor:default; pointer-events:none;}
.qcard.locked .opt:not(.chosen){opacity:.45;}
.opt.chosen{border-color:var(--violet); background:#ece2ff; font-weight:800;}
.opt.chosen .bullet{background:var(--violet); color:#fff;}

.qcard.correct{border-color:var(--green); background:#f2fff6;}
.qcard.incorrect{border-color:var(--red); background:#fff3f3;}
.opt.correct-answer{border-color:var(--green); background:#dcfce7; font-weight:800;}
.opt.correct-answer .bullet{background:var(--green); color:#fff;}
.opt.wrong-answer{border-color:var(--red); background:#fee2e2;}
.opt.wrong-answer .bullet{background:var(--red); color:#fff;}
.explain{
  margin-top:12px; padding:12px 14px; border-radius:12px;
  background:#f5f3ff; border-left:5px solid var(--violet); font-size:15.5px; color:var(--ink-soft);
  display:none;
}
.qcard.graded .explain{display:block;}
.badge-result{
  display:inline-block; font-weight:900; font-size:13px; padding:4px 12px; border-radius:999px; margin-left:8px;
}
.badge-result.ok{background:var(--green); color:#fff;}
.badge-result.bad{background:var(--red); color:#fff;}

#finalScore{
  display:none; text-align:center; border-radius:22px; padding:30px;
  color:#fff; box-shadow:var(--shadow); margin:20px 0;
  background:linear-gradient(120deg,var(--violet),var(--pink),var(--orange));
}
#finalScore.show{display:block;}
#finalScore .big{font-size:50px; font-weight:900;}
#finalScore .msg{font-size:18px; font-weight:700; margin-top:6px;}
#retryBtn{
  margin-top:16px; border:none; cursor:pointer; font-weight:900; font-size:16px;
  padding:11px 24px; border-radius:12px; background:#fff; color:var(--violet-d);
}
.lockNotice{
  background:#fff8f0; border:2px solid #fed7aa; border-radius:14px; padding:14px 18px;
  margin-bottom:18px; font-weight:700; color:#9a3412; font-size:15.5px;
}

footer{text-align:center; color:var(--ink-soft); font-size:14px; padding:20px; opacity:.7;}
</style>
</head>
<body>

<header class="top">
  <span class="eyebrow">✈️ IASCA · INTER AVIATION SERVICES</span>
  <h1>Repaso SMS</h1>
  <div class="sub">Sistema de Gestión de la Seguridad Operacional</div>
  <div class="chips">
    <span>4 temas de teoría</span>
    <span>Modelo SHEL(L) y Reason</span>
    <span>Gestión del riesgo</span>
    <span>Test final de 40 preguntas</span>
  </div>
</header>

<nav class="tabs" id="tabsNav"></nav>

<main id="mainContent"></main>

<footer>Repaso interactivo — Uso académico · SMS IASCA · 2026</footer>

<script>
/* =========================================================
   CONTENIDO DE MÓDULOS (basado en el material SMS de IASCA)
   ========================================================= */
const MODULES = [
{
  id:"tema1", num:"01", title:"Sistema de Gestión de la Seguridad Operacional (SMS)",
  desc:"Definiciones, marco normativo, evolución histórica y modelo SHEL(L)",
  html:`
  <div class="card">
    <h3>🎯 1.1 Objetivo del curso</h3>
    <ul>
      <li>Que cada participante pueda <strong>definir las características de un SMS</strong>, explicar la importancia de la descripción del sistema y el análisis de carencias para mitigar riesgos de forma <strong>proactiva</strong>, antes de que ocurra un incidente o accidente.</li>
      <li>Que sea capaz de <strong>identificar diferentes tipos de peligros</strong> dentro y fuera de su ambiente de trabajo.</li>
      <li>Que se convierta en un <strong>gestor de riesgos</strong>, especialmente durante la entrega de servicios o productos.</li>
    </ul>
  </div>

  <div class="card alt">
    <h3>📘 1.2 Sistema de Gestión de la Seguridad Operacional (SMS)</h3>
    <p>Un <strong>Safety Management System</strong> es un <strong>enfoque sistemático</strong> para la gestión de la seguridad operacional que incluye políticas, estructura institucional, líneas de responsabilidad y procedimientos, orientados a mantener un control específico sobre la <strong>identificación de peligros</strong> y la <strong>gestión del riesgo</strong>.</p>
    <p>Su propósito es <strong>mejorar continuamente</strong> el rendimiento de la seguridad operacional: identificando peligros, recopilando y analizando datos, y evaluando los riesgos de forma constante.</p>
  </div>

  <div class="card">
    <h3>🧩 1.3 Definición de sistema y gestión</h3>
    <p><strong>Sistema:</strong> conjunto de partes que trabajan para lograr un objetivo común, o conjunto de elementos interrelacionados.</p>
    <div class="tag-row">
      <span class="tag">Natural — ej. un ave, un humano</span>
      <span class="tag cy">Artificial — ej. un avión</span>
      <span class="tag or">Social — ej. una empresa</span>
    </div>
    <p><strong>Gestión:</strong> acción o trámite que se lleva a cabo, junto con otros, para conseguir o resolver algo. Requiere conciencia, esfuerzo, recursos y buena voluntad.</p>
    <p><strong>Seguridad operacional:</strong> el estado en que el riesgo de lesiones a personas o daños a bienes se reduce y se mantiene en un nivel aceptable (o por debajo), mediante un proceso continuo de identificación de peligros y gestión de riesgos.</p>
    <p><strong>Programa de Seguridad del Estado (SSP):</strong> conjunto integrado de reglamentos, normas, procedimientos y actividades orientadas a mejorar la seguridad operacional. Cada Estado es responsable de implementarlo mediante reglamentos, investigación de accidentes/incidentes, garantía y promoción de la seguridad.</p>
    <p><strong>Encargado de Seguridad Operacional / Gerente Responsable:</strong> es el responsable individual y punto focal de la implementación y mantenimiento de un SMS efectivo dentro de la organización.</p>
    <p><strong>Lema de la filosofía de gestión de seguridad:</strong> <span class="hl">"Mantener los riesgos tan bajo como sea razonablemente posible"</span>.</p>
  </div>

  <div class="card ok">
    <h3>🏛️ 1.4 Organismos que regulan el SMS</h3>
    <p>El SMS es un estándar reconocido a nivel global por la <strong>OACI</strong> (Organización de Aviación Civil Internacional) y a nivel local, en República Dominicana, por el <strong>IDAC</strong> (Instituto Dominicano de Aviación Civil).</p>
    <table>
      <tr><th>Nivel</th><th>Norma</th></tr>
      <tr><td>Internacional (OACI)</td><td>Doc. 9859 y Anexo 19</td></tr>
      <tr><td>Local (República Dominicana)</td><td>RAD 110, publicado el 10/10/2008</td></tr>
    </table>
  </div>

  <div class="card warn">
    <h3>⏳ 1.5 Evolución del pensamiento en materia de seguridad</h3>
    <p>El progreso de la seguridad operacional en aviación se divide en tres épocas:</p>
    <table>
      <tr><th>Época</th><th>Periodo</th><th>Enfoque</th></tr>
      <tr><td><strong>Factores técnicos</strong></td><td>1950–1970</td><td>Reactivo — mejoras tecnológicas y cumplimiento de regulaciones</td></tr>
      <tr><td><strong>Factores humanos</strong></td><td>1970–1990</td><td>Reactivo y proactivo — interfaz hombre-máquina, error humano (James T. Reason)</td></tr>
      <tr><td><strong>Factores institucionales/organizacionales</strong></td><td>1990–actualidad</td><td>Predictivo — basado en evidencias y trabajo real, "accidente institucional"</td></tr>
    </table>
    <p>James T. Reason plantea que el <strong>error humano es inherente al ser humano</strong> y "va a existir siempre", especialmente en industrias de alto riesgo; el reto no es eliminarlo, sino <strong>aprender a reducir su impacto</strong>.</p>
  </div>

  <div class="card">
    <h3>🧀 1.6 Concepto de causalidad y modelo SHEL(L)</h3>
    <p><strong>Causalidad:</strong> relación entre dos variables donde un cambio en una va seguido de un cambio en la otra.</p>
    <p>El <strong>modelo de Reason</strong> (conocido como "modelo del queso suizo") explica cómo distintas <strong>condiciones latentes</strong> — en el lugar de trabajo, las personas y la organización — se alinean con fallas en las <strong>defensas</strong> del sistema (tecnología, entrenamiento, reglamentación), permitiendo que ocurra un accidente.</p>
    <h4>Modelo SHEL(L)</h4>
    <p>Herramienta conceptual para analizar la interacción de los componentes del sistema de aviación:</p>
    <div class="tag-row">
      <span class="tag">S — Software: procedimientos, reglamentos, documentación</span>
      <span class="tag cy">H — Hardware: equipos, máquina, radares</span>
      <span class="tag or">E — Environment: entorno, cultura, meteorología</span>
      <span class="tag gr">L — Liveware: las personas (tripulación, mecánicos, gerentes)</span>
    </div>
    <p>El <strong>Liveware</strong> es el elemento central: considera la conducta humana, las relaciones humanas y los factores fisiológicos.</p>
  </div>
  `
},
{
  id:"tema2", num:"02", title:"Prevención de Accidentes (OACI)",
  desc:"Conceptos de accidente, incidente, peligro, consecuencia, riesgo y cultura",
  html:`
  <div class="card">
    <h3>🛡️ 2.1 Concepto de Prevención de Accidentes (OACI)</h3>
    <p>Es la <strong>localización, detección y evaluación del peligro</strong>, junto con la elaboración de métodos y recomendaciones apropiadas, y la adopción de medidas para <strong>minimizar o evitar</strong> los accidentes e incidentes de aviación.</p>
  </div>

  <div class="card alt">
    <h3>✈️ 2.2 Concepto de Accidente Aéreo</h3>
    <p>Suceso ocurrido en la operación de una aeronave tripulada, entre el momento en que una persona <strong>entra a bordo con intención de volar</strong> y el momento en que <strong>todas las personas han desembarcado</strong> (o en aeronaves no tripuladas, desde que está lista para moverse hasta que se apaga el sistema de propulsión), durante el cual ocurre alguno de los siguientes:</p>
    <ol>
      <li>Una persona sufre <strong>lesiones mortales o graves</strong> por estar en la aeronave, por contacto con partes de esta, o por exposición a gases calientes de un motor (excepto causas naturales, autolesión, lesiones causadas por terceros, o pasajeros clandestinos fuera de áreas normales).</li>
      <li>La aeronave sufre <strong>daños que afectan su resistencia estructural</strong>, performance o características de vuelo, que exigen reparación importante o recambio (excepto fallas menores de motor, hélices, antenas, neumáticos o frenos).</li>
      <li>La aeronave <strong>desaparece</strong> o queda totalmente <strong>inaccesible</strong>.</li>
    </ol>
  </div>

  <div class="card">
    <h3>⚠️ 2.3 Concepto de Incidente Aéreo</h3>
    <p>Según la OACI: <span class="hl">"Todo suceso relacionado con la utilización de una aeronave que no llegue a ser un accidente, que afecte o pueda afectar la seguridad de las operaciones."</span></p>
    <p>Los accidentes son la consecuencia de una <strong>cadena de eventos</strong>, no de una sola causa aislada.</p>
  </div>

  <div class="card ok">
    <h3>🧷 2.4 Concepto de peligro, consecuencia y riesgo</h3>
    <p><strong>Peligro:</strong> condición u objeto con el potencial de matar, causar lesiones, dañar equipo o estructuras, perder material o reducir la capacidad de realizar funciones prescritas.</p>
    <p><strong>Consecuencia:</strong> resultado potencial de un peligro.</p>
    <p><strong>Riesgo:</strong> la evaluación de las consecuencias de un peligro, expresada en términos de <strong>probabilidad y gravedad</strong>, tomando como referencia la peor condición previsible.</p>
    <p><em>Ejemplo del material:</em> un viento cruzado de 15 nudos es un <strong>peligro</strong>; que el piloto no pueda controlar la aeronave al despegar o aterrizar es la <strong>consecuencia</strong>; evaluar esa posibilidad en términos de probabilidad y severidad es el <strong>riesgo</strong>.</p>
  </div>

  <div class="card warn">
    <h3>🌍 2.5 Cultura</h3>
    <p>La cultura reúne a las personas como miembros de un grupo y da pautas de comportamiento en situaciones normales e inusuales, influyendo en su modo de pensar y actuar.</p>
    <table>
      <tr><th>Tipo de cultura</th><th>Qué diferencia</th></tr>
      <tr><td><strong>Nacional</strong></td><td>El sistema de valores de cada nación</td></tr>
      <tr><td><strong>Organizacional / Corporativa</strong></td><td>Valores y comportamientos entre organizaciones (ej. gobierno vs. privadas)</td></tr>
      <tr><td><strong>Profesional</strong></td><td>Valores y comportamiento de grupos profesionales (pilotos, TCP, controladores, mecánicos, etc.)</td></tr>
    </table>
    <p>Ningún emprendimiento humano está libre de influencias culturales.</p>
  </div>
  `
},
{
  id:"tema3", num:"03", title:"Metodologías de Identificación de Peligros",
  desc:"Gestión reactiva, preventiva, proactiva y predictiva; error, infracción, investigación y mitigación",
  html:`
  <div class="card">
    <h3>🔍 3.1 Gestión del riesgo</h3>
    <p>Existen <strong>cuatro metodologías</strong> para identificar peligros:</p>
    <div class="tag-row">
      <span class="tag">Reactiva</span>
      <span class="tag cy">Preventiva</span>
      <span class="tag or">Proactiva</span>
      <span class="tag gr">Predictiva</span>
    </div>
  </div>

  <div class="card alt">
    <h3>⏮️ 3.2 Gestión de la Seguridad Reactiva</h3>
    <p>Analiza <strong>resultados o eventos pasados</strong>. Los peligros se identifican mediante la investigación de sucesos ya ocurridos (incidentes y accidentes), que son indicadores claros de deficiencias del sistema.</p>
    <ul>
      <li>Investigación de accidentes e incidentes serios.</li>

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

    return {...q, options:shuffled.map(o=>o.opt), correct:newCorrect, answered:false, chosen:null, id:idx};
  } else {
    const flip = Math.random()<0.5;
    const opts = flip ? ["Falso","Verdadero"] : ["Verdadero","Falso"];
    const correctLabel = q.correct ? "Verdadero" : "Falso";
    const newCorrect = opts.indexOf(correctLabel);
    return {...q, options:opts, correct:newCorrect, answered:false, chosen:null, id:idx};
  }
});

const qWrap = document.getElementById("questionsWrap");
const progressText = document.getElementById("progressText");
const progressBarInner = document.getElementById("progressBarInner");
const gradeBtn = document.getElementById("gradeBtn");
let graded=false;

renderQuestions();

function renderQuestions(){
  qWrap.innerHTML="";
  runtimeQ.forEach((q,qi)=>{
    const card=document.createElement("div");
    card.className="qcard"; card.id="q-"+qi;
    card.innerHTML=`
      <div class="qhead">
        <div class="qnum">${qi+1}</div>
        <div>
          <div class="qtype">${q.type==="mc"?"Selección múltiple":"Verdadero / Falso"}</div>
          <div class="qtext">${q.q}</div>
        </div>
      </div>
      <div class="options"></div>
      <div class="explain">${q.exp}</div>
    `;
    const optWrap=card.querySelector(".options");
    q.options.forEach((optText,oi)=>{
      const opt=document.createElement("div");
      opt.className="opt";
      opt.dataset.idx=oi;
      opt.innerHTML=`<div class="bullet">${String.fromCharCode(65+oi)}</div><div>${optText}</div>`;
      opt.onclick=()=>selectOption(qi,oi);
      optWrap.appendChild(opt);
    });
    qWrap.appendChild(card);
  });
}

function selectOption(qi,oi){
  if(graded) return;
  const q = runtimeQ[qi];
  if(q.answered) return;
  q.answered = true;
  q.chosen = oi;
  const card = document.getElementById("q-"+qi);
  card.classList.add("locked");
  card.querySelectorAll(".opt").forEach((el,i)=>{
    if(i===oi) el.classList.add("chosen");
  });
  updateProgress();
}

function updateProgress(){
  const answeredCount = runtimeQ.filter(q=>q.answered).length;
  progressText.textContent = answeredCount+" / "+runtimeQ.length+" respondidas";
  progressBarInner.style.width = (answeredCount/runtimeQ.length*100)+"%";
  if(answeredCount===runtimeQ.length){
    gradeBtn.classList.add("enabled");
  } else {
    gradeBtn.classList.remove("enabled");
  }
}

gradeBtn.onclick=()=>{
  if(!gradeBtn.classList.contains("enabled") || graded) return;
  graded = true;
  let score=0;
  runtimeQ.forEach((q,qi)=>{
    const card=document.getElementById("q-"+qi);
    card.classList.add("graded");
    const isCorrect = q.chosen===q.correct;
    if(isCorrect) score++;
    card.classList.add(isCorrect?"correct":"incorrect");
    card.querySelector(".qtext").insertAdjacentHTML("beforeend",
      isCorrect? '<span class="badge-result ok">✓ CORRECTA</span>' : '<span class="badge-result bad">✗ INCORRECTA</span>');
    card.querySelectorAll(".opt").forEach((el,i)=>{
      if(i===q.correct) el.classList.add("correct-answer");
      else if(i===q.chosen && !isCorrect) el.classList.add("wrong-answer");
    });
  });
  showFinalScore(score);
  progressText.textContent = "Examen calificado";
  window.scrollTo({top:document.getElementById("finalScore").offsetTop-90, behavior:"smooth"});
};

function showFinalScore(score){
  const total = runtimeQ.length;
  const pct = Math.round(score/total*100);
  let msg;
  if(pct>=90) msg="🏆 Excelente — dominas la materia.";
  else if(pct>=75) msg="✅ Muy bien — estás listo/a para el examen.";
  else if(pct>=60) msg="📘 Aprobado — repasa los temas fallados.";
  else msg="🔁 Necesitas repasar más antes del examen final.";
  const box=document.getElementById("finalScore");
  box.className="show";
  box.innerHTML=`
    <div class="big">${score} / ${total}</div>
    <div class="msg">${pct}% — ${msg}</div>
    <button id="retryBtn" onclick="location.reload()">↺ Reintentar Test</button>
  `;
}
</script>
